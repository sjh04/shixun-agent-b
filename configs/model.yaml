runtime:
  default_mode: prompt_json

model:
  backend: transformers
  # 相对 configs/ 解析,默认指向仓库内 models/(已 .gitignore);把权重放到 models/Qwen3.5-4B 即可。
  model_name_or_path: ../models/Qwen3.5-4B
  tokenizer_name_or_path: ../models/Qwen3.5-4B
  local_files_only: true
  trust_remote_code: true
  torch_dtype: bfloat16
  device_map: auto

generation:
  max_new_tokens: 1024
  do_sample: false
  temperature: 0
  top_p: 1

context:
  max_input_tokens: 4096

tool_calling:
  mode: prompt_json

outputs:
  save_raw_output: true
  save_ai_message: true
  save_prompt_text: true
