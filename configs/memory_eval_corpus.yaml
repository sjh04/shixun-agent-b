# B5 检索评测（RQ1）专用配置：指向 data/memory_eval/corpus 标注语料。
# 与生产 memory.yaml 的差异都服务于"对照纯净"：
# - max_memory_chars 放大到 20000：保证 top_k 全部进入排名，注入截断不干扰检索指标；
# - compression.enabled false：RQ1 只测排序，压缩是 RQ2 的实验对象；
# - update_access_on_load false：评测本身不回写 last_accessed_at / access_count，
#   否则跑一遍评测就污染语料的时近性，结果不可复现。
# retrieval 各开关由 run_b5_ablation.py 按消融矩阵逐行覆盖。
memory:
  root_dir: ../data/memory_eval/corpus
  global_memory_dir: global
  conversation_memory_dir: conversations
  index_path: memory_index.json
  max_memory_chars: 20000

  retrieval:
    mode: hybrid
    top_k: 5
    candidate_limit: 30
    chunk_chars: 700
    chunk_overlap: 120
    rrf_k: 60
    recency_half_life_days: 30
    include_all_conversations: true
    include_global_when_query: true
    use_chunk: true
    use_three_factor: true
    three_factor_weights:
      relevance: 0.8
      recency: 0.1
      importance: 0.1
    use_hyde: true
    use_rerank: true
    vector_backend: qwen_or_hashing
    hashing_dim: 768
    cache_embeddings: true
    vector_cache_path: memory_vector_cache.json

  compression:
    enabled: false
    summary_chars: 700
    summary_sentences: 5
    min_chars_for_summary: 480

  integration:
    enabled: true
    duplicate_similarity: 0.92
    conflict_similarity: 0.28
    use_llm_judge: true

  poison_gate:
    enabled: false        # RQ1 检索评测不触发保存路径；RQ4 由 run_b5_integration_eval.py 单独开启
    action: flag
    trusted_memory_types: [global]
    conflict_threshold: 0.32
    use_llm_judge: true

  lifecycle:
    max_memories: 200
    protect_global: true
    importance_default: 5
    update_access_on_load: false
    reflect_enabled: false
    reflect_every_n: 10
    reflect_min_cluster_size: 3
    reflect_similarity_threshold: 0.35

  llm:
    enabled: false
    model_config: ../configs/model.yaml
    mode: prompt_json
    max_new_tokens: 512
